<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · EdgeForms</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <a class="brand" href="/">EdgeForms <small>RegisterMySite</small></a>
      <div class="nav-links"><a href="/signup.html">Create account</a></div>
    </nav>
    <form class="auth-box card" id="form">
      <h1 style="margin-top:0;">Welcome back</h1>
      <label>Email<input name="email" type="email" required autocomplete="email" /></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password" /></label>
      <p class="err" id="err"></p>
      <button class="primary" type="submit">Sign in</button>
    </form>
  </div>
  <script>
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const err = document.getElementById("err");
      err.textContent = "";
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ email: fd.get("email"), password: fd.get("password") }),
      });
      const raw = await res.text();
      let data = {};
      try { data = raw ? JSON.parse(raw) : {}; } catch { data = { error: raw || `Sign in failed (${res.status})` }; }
      if (!res.ok) { err.textContent = data.error || "Could not sign in"; return; }
      location.href = "/app.html";
    });
  </script>
</body>
</html>
